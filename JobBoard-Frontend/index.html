<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finn's Job Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-blue-600 p-4 text-white shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">JobBoard Connect</h1>
            <span class="text-sm bg-blue-700 px-3 py-1 rounded-full">Live API Connected</span>
        </div>
    </nav>

    <main class="container mx-auto mt-10 px-4">
        <h2 class="text-3xl font-bold text-gray-800 mb-6">Current Opportunities</h2>
        
        <!-- This is where the jobs will appear -->
        <div id="job-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="text-gray-500 italic">Fetching jobs from Azure...</p>
        </div>
    </main>

    <script>
        const API_URL = "https://jobboard-1cet.onrender.com/api/jobpostings";

        async function fetchJobs() {
            try {
                const response = await fetch(API_URL);
                const jobs = await response.json();
                const container = document.getElementById('job-container');
                container.innerHTML = ''; // Clear the loading message

                jobs.forEach(job => {
                    container.innerHTML += `
                        <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-500 hover:shadow-xl transition-shadow">
                            <h3 class="text-xl font-bold text-gray-900">${job.title}</h3>
                            <p class="text-blue-600 font-semibold mb-2">${job.company}</p>
                            <p class="text-gray-600 text-sm mb-4 line-clamp-3">${job.description}</p>
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-medium bg-gray-200 px-2 py-1 rounded text-gray-700">${job.location}</span>
                                <button class="text-blue-600 font-bold hover:underline">Apply Now →</button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error fetching jobs:", error);
                document.getElementById('job-container').innerHTML = `<p class="text-red-500">Could not load jobs. Check CORS settings!</p>`;
            }
        }

        fetchJobs();
    </script>
</body>
</html>
